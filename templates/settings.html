{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1>Settings</h1>
        <p>Manage your account security.</p>
    </div>
</div>

<div class="panel form-card">
    <div class="panel-header"><h3>Change Password</h3></div>
    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
            <label>Current Password</label>
            <div class="password-field">
                        <input type="password" name="current_password" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordField(this)" aria-label="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
        </div>
        <div class="field">
            <label>New Password</label>
            <div class="password-field">
                        <input type="password" name="new_password" placeholder="At least 6 characters" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordField(this)" aria-label="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
        </div>
        <div class="field">
            <label>Confirm New Password</label>
            <div class="password-field">
                        <input type="password" name="confirm_password" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordField(this)" aria-label="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
        </div>
        <button type="submit" class="btn">Update Password</button>
    </form>
</div>

<div class="panel form-card">
    <div class="panel-header"><h3>Account Info</h3></div>
    <p style="color: var(--text-dim); font-size: 0.9rem;">
        Member since {{ user.created_at.strftime('%B %d, %Y') }} · Account status:
        <span class="badge {{ 'active' if user.active else 'inactive' }}">{{ 'Active' if user.active else 'Inactive' }}</span>
    </p>
</div>
{% endblock %}
