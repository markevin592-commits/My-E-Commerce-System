<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Forbidden</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="center-page">
        <h1>403</h1>
        <p style="color: var(--text-dim);">Your role doesn't have access to this page.</p>
        {% if user %}
        <a href="{{ url_for(user.dashboard_url()) }}" class="btn">Back to Dashboard</a>
        {% else %}
        <a href="{{ url_for('login') }}" class="btn">Log In</a>
        {% endif %}
    </div>
</body>
</html>
