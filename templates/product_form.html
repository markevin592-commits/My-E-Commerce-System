{% extends "base.html" %}
{% block title %}{{ 'Edit Product' if mode=='edit' else 'Add Product' }}{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1>{{ 'Edit Product' if mode=='edit' else 'Add New Product' }}</h1>
        <p>Fields marked required must be filled correctly.</p>
    </div>
</div>

<div class="panel form-card">
    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
            <label>Product Name</label>
            <input type="text" name="name" value="{{ form.name or '' }}" required>
        </div>
        <div class="field">
            <label>Description</label>
            <textarea name="description" rows="3">{{ form.description or '' }}</textarea>
        </div>
        <div class="form-grid">
            <div class="field">
                <label>Price (₱)</label>
                <input type="number" step="0.01" min="0" name="price" value="{{ form.price or '' }}" required>
            </div>
            <div class="field">
                <label>Stock Quantity</label>
                <input type="number" min="0" name="stock" value="{{ form.stock or '' }}" required>
            </div>
        </div>
        <div class="field">
            <label>Category</label>
            <input type="text" name="category" value="{{ form.category or '' }}" placeholder="e.g. Electronics">
        </div>

        <div class="actions-row">
            <button type="submit" class="btn">{{ 'Save Changes' if mode=='edit' else 'Add Product' }}</button>
            <a href="{{ url_for('manage_products') }}" class="btn ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
